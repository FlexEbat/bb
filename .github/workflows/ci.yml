name: ci
on:
  push:
    branches: [main, dev]
  pull_request:
permissions:
  contents: write      # only to push the logs of a job to the branch ci-logs
defaults:
  run:
    shell: bash
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/matrix/deps.sh
      - run: make lint && make spec
  suite:                       # S9.1: Debian, Ubuntu, RHEL family and Fedora
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:13', 'debian:12', 'ubuntu:24.04', 'fedora:latest', 'rockylinux:9', 'almalinux:9']
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - run: (command -v apt-get >/dev/null && apt-get update -qq && apt-get install -y -qq git) || dnf install -y git
      - uses: actions/checkout@v4
      - run: bash tests/matrix/deps.sh
      - run: tests/run.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bash tests/matrix/publish-log.sh "suite-${{ matrix.image }}"
  legacy:                      # S9.2
    runs-on: ubuntu-24.04
    container:
      image: debian:12
      options: --privileged
    steps:
      - run: apt-get update -qq && apt-get install -y -qq git
      - uses: actions/checkout@v4
      - run: bash tests/matrix/deps.sh
      - run: bash tests/matrix/legacy.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bash tests/matrix/publish-log.sh legacy
  host:                        # S9.3, S9.5, S9.6 on a real systemd host with Docker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/matrix/deps.sh
      - run: sudo bash tests/matrix/host.sh 2>&1 | tee ci.log; exit "${PIPESTATUS[0]}"
      - if: always()
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: bash tests/matrix/publish-log.sh host
